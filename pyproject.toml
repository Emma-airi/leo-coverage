[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-coverage"
version = "0.1.0"
description = "Validated coverage model for large LEO satellite constellations"
authors = [{ name = "Emmanuel Airiofolo" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["leo_coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
